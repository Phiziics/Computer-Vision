project:
  name: SentinelVision AI
  seed: 42

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  embeddings_dir: data/embeddings
  metadata_dir: data/metadata

dataset:
  name: UCF-Crime
  data_type: long_untrimmed_surveillance_video

video:
  allowed_extensions:
    - .mp4
    - .avi
    - .mov
    - .mkv

validation:
  minimum_duration_seconds: 1.0
  require_readable_video: true

splits:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  stratify_column: category
  random_state: 42

clips:
  duration_seconds: 4.0
  stride_seconds: 4.0
  minimum_clip_seconds: 2.0
  include_partial_final_clip: true