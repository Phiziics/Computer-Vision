project:
  name: SentinelVision AI
  seed: 42

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  embeddings_dir: data/embeddings
  metadata_dir: data/metadata

dataset:
  name: UCF-Crime
  data_type: long_untrimmed_surveillance_video

